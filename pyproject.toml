[project]
name = "storeops"
version = "0.1.0"
description = "StoreOps — retail store operations management REST API, governed by the .harness/ development harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# mypy — strict. Backs hard gate HG-7 (deterministic suite) and contributes the
# automated half of HG-2 (error contract): an untyped raise path cannot hide.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
exclude = ['^\.venv/', '^build/', '^dist/']

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# ruff — lint + format. TRY/BLE/EM rules are the automated backing for HG-2:
#   TRY002  raise vanilla Exception          -> Failure Mode 2
#   TRY301  raise inside try (abstract it)   -> Failure Mode 2
#   BLE001  blind except Exception           -> Failure Mode 2
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", ".harness"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort — import order, also makes boundary violations visible in diffs
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "TID",       # flake8-tidy-imports — relative-import ban supports module boundaries
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "RET",       # flake8-return
    "TRY",       # tryceratops — error contract (Failure Mode 2)
    "BLE",       # blind except (Failure Mode 2)
    "EM",        # exception messages
    "RSE",       # raise
]
ignore = [
    "TRY003",    # long messages outside exception class: AppError carries message by design
    "EM101",     # string literal in exception: acceptable for AppError subclasses
    "EM102",
]

[tool.ruff.lint.flake8-tidy-imports]
# Cross-module imports must be absolute and explicit so import-linter can see them.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]

# ---------------------------------------------------------------------------
# pytest + coverage
# `source = ["app"]` means the bare `pytest --cov` in the harness gate resolves
# to app/ without extra flags, so the gate command stays copy-pasteable.
# `fail_under = 80` is the automated component of hard gate HG-3.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
